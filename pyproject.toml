[project]
name = "google-adk-starter"
version = "0.1.0"
description = "A starter Google ADK email agent powered by Nebius AI Studio and Resend."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-adk>=1.0.0",
  "litellm>=1.65.5",
  "resend>=2.0.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
